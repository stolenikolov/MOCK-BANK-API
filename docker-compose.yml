services:
  postgres:
    image: postgres:16-alpine
    container_name: mock-bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mock_bank
    ports:
      - '5432:5432'
    volumes:
      - mock-bank-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mock_bank']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mock-bank-data:
