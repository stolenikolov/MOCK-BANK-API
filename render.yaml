services:
  - type: web
    name: mock-bank-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mock-bank-db
          property: connectionString
      # Set these three in the Render dashboard.
      - key: API_KEY
        sync: false
      - key: BIZNISMK_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
      - key: WEBHOOK_TIMEOUT_MS
        value: '8000'
      - key: WEBHOOK_RETRY_BACKOFF_MS
        value: '2000,10000,30000'

databases:
  - name: mock-bank-db
    plan: basic-256mb
